<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fabric prints scene</title>
<style>html,body{margin:0;background:#0b0c11;overflow:hidden}#stage{width:1600px;height:1000px}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<script type="module">
// Photo illustration: generated textile prints hanging as fabric swatches in a dark showroom.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { patternCanvas, rng } from '../patterns.js';

const W = 1600, H = 1000;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#15161b');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(1.0, 0.55, 5.3);
camera.lookAt(0.1, 0.25, 0);

// Back wall and floor
const wall = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), new THREE.MeshStandardMaterial({ color: '#23242b', roughness: 0.95 }));
wall.position.set(0, 0, -0.9);
wall.receiveShadow = true;
scene.add(wall);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 10), new THREE.MeshStandardMaterial({ color: '#1a1b20', roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.95;
floor.receiveShadow = true;
scene.add(floor);

// Weave bump texture shared by all swatches
const weave = document.createElement('canvas');
weave.width = weave.height = 256;
{
  const c = weave.getContext('2d');
  c.fillStyle = '#808080'; c.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 256; i += 4) {
    c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(i, 0, 2, 256);
    c.fillStyle = 'rgba(0,0,0,0.18)'; c.fillRect(0, i, 256, 2);
  }
}
const weaveTex = new THREE.CanvasTexture(weave);
weaveTex.wrapS = weaveTex.wrapT = THREE.RepeatWrapping;
weaveTex.repeat.set(10, 12);

// Rail
const metal = new THREE.MeshStandardMaterial({ color: '#b9bec6', metalness: 1, roughness: 0.3 });
const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 4.2, 24), metal);
rail.rotation.z = Math.PI / 2;
rail.position.set(0, 0.98, 0);
rail.castShadow = true;
scene.add(rail);

const names = ['batik', 'tropical', 'brush', 'deco', 'floral', 'ikat'];
const r = rng(4);
names.forEach((name, i) => {
  const w = 0.56, h = 1.12;
  const geo = new THREE.PlaneGeometry(w, h, 90, 160);
  const pos = geo.attributes.position;
  const phase = r() * 6;
  for (let v = 0; v < pos.count; v++) {
    const x = pos.getX(v), y = pos.getY(v);
    const drop = (h / 2 - y) / h; // 0 at the top, 1 at the bottom
    const fold = Math.sin(x * 22 + phase) * 0.035 + Math.sin(x * 9 + phase * 1.7) * 0.02;
    pos.setZ(v, fold * (0.25 + drop * 1.1));
    pos.setX(v, x * (1 - drop * 0.06));
  }
  geo.computeVertexNormals();
  const tex = new THREE.CanvasTexture(patternCanvas(name, 1024));
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(w / h, 1); // show a w:h window of the square print, so nothing repeats
  const mat = new THREE.MeshPhysicalMaterial({
    map: tex, bumpMap: weaveTex, bumpScale: 0.6, roughness: 0.82, sheen: 0.6, sheenRoughness: 0.5,
    sheenColor: new THREE.Color('#ffffff'), side: THREE.DoubleSide,
  });
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  m.position.set(-1.6 + i * 0.64, 0.97 - h / 2, (i % 2) * 0.12);
  m.rotation.y = -0.12 + r() * 0.1;
  scene.add(m);
  // Clips
  for (const cx of [-w * 0.35, w * 0.35]) {
    const clip = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.07, 0.03), metal);
    clip.position.set(m.position.x + cx, 0.96, m.position.z + 0.01);
    scene.add(clip);
  }
});

// Lighting: warm key spot, cool fill, brand-red rim from behind
const key = new THREE.SpotLight('#fff1dc', 60, 20, 0.55, 0.6, 1.6);
key.position.set(-2.2, 3.4, 3.2);
key.target.position.set(0, -0.2, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 6;
scene.add(key, key.target);
const fill = new THREE.DirectionalLight('#aebfff', 0.35);
fill.position.set(3, 1, 3);
scene.add(fill);
const rim = new THREE.PointLight('#ff3b30', 8, 6, 1.4);
rim.position.set(2.2, 0.6, -0.6);
scene.add(rim);

renderer.render(scene, camera);
window.sceneReady = true;
</script>
</body>
</html>
